name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & build sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Verify Expo project health
        run: npx expo-doctor
        continue-on-error: true # advisory only — flags issues without blocking merges

      - name: Bundle sanity check (web export)
        run: npx expo export --platform web --output-dir /tmp/export-check
