name: CD

# Publishes an OTA update via EAS Update whenever main is pushed. This is a
# scaffold: it needs a couple of one-time setup steps before it can actually
# run (see "Activating this workflow" in the README). Until then it skips
# itself cleanly instead of failing the build.
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    if: ${{ vars.EAS_PROJECT_LINKED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: eas update --auto --non-interactive
